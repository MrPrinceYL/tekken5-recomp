[package]
name = "t5-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
ps2-runtime = { path = "../ps2-runtime" }
t5-recomp = { path = "../t5-recomp" }
cpal = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sony pads over HID (hid.rs); the pure-Rust backends need no C compiler.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
